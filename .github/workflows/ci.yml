name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: server.json is valid and versions match
        run: |
          node -e "
            const p=require('./package.json'), s=require('./server.json');
            if (p.version!==s.version || p.version!==s.packages[0].version) { console.error('version mismatch'); process.exit(1); }
            if (!s.remotes.some(r=>r.type==='streamable-http' && r.url==='https://mcp.alterlab.io/mcp')) { console.error('remote missing'); process.exit(1); }
          "
